<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900&amp;family=Source+Serif+4:ital,opsz,wght@1,8..60,500;1,8..60,600&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,sans-serif;color:#0F1D2E;background:#F1F6F4}a{color:#2D5A87}a:hover{color:#E3735C}
</style>
</helmet>
<div data-screen-label="Login" style="font-family:Inter,sans-serif;background:#EAF1F0;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:56px 20px;box-sizing:border-box">
  <div style="background:#FFFFFF;border:1px solid rgba(15,29,46,.08);border-radius:16px;box-shadow:0 6px 30px rgba(15,29,46,.06);width:100%;max-width:480px;padding:48px clamp(24px,6vw,56px) 52px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:0">
    <a href="Home.dc.html" style="text-decoration:none;display:block">
      <img src="careorbit-logo-nav2.png" alt="CareOrbit" style="height:48px;width:auto;display:block">
    </a>
    <h1 style="font-family:Lato,sans-serif;font-weight:400;font-size:30px;letter-spacing:-0.01em;margin:26px 0 0;color:#0F1D2E">Log In</h1>
    <p style="font-size:16px;color:rgba(15,29,46,.6);margin:18px 0 0">Welcome back!</p>
    <sc-if value="{{ notice }}" hint-placeholder-val="{{ false }}">
      <div style="width:100%;box-sizing:border-box;background:#FDF1EE;border:1px solid rgba(227,115,92,.4);border-radius:10px;padding:12px 15px;font-size:13.5px;line-height:1.5;color:#A8412F;margin-top:18px">{{ notice }}</div>
    </sc-if>
    <div style="width:100%;display:flex;flex-direction:column;gap:18px;margin-top:26px">
      <div style="position:relative">
        <span style="position:absolute;top:-8px;left:14px;background:#FFFFFF;padding:0 6px;font-size:13px;color:rgba(15,29,46,.6)">Email address<span style="color:rgba(15,29,46,.45)">*</span></span>
        <input type="email" value="{{ email }}" onChange="{{ onEmail }}" autocomplete="email" style="font-family:Inter,sans-serif;font-size:16px;padding:20px 16px;border-radius:10px;border:1.5px solid rgba(15,29,46,.35);background:#FFFFFF;color:#0F1D2E;outline:none;width:100%;box-sizing:border-box;transition:border-color .2s" style-focus="border-color:#2D5A87">
      </div>
      <div style="position:relative">
        <input type="{{ pwType }}" value="{{ password }}" onChange="{{ onPassword }}" placeholder="Password*" autocomplete="current-password" style="font-family:Inter,sans-serif;font-size:16px;padding:20px 48px 20px 16px;border-radius:10px;border:1.5px solid rgba(15,29,46,.2);background:#FFFFFF;color:#0F1D2E;outline:none;width:100%;box-sizing:border-box;transition:border-color .2s" style-focus="border-color:#2D5A87">
        <button onClick="{{ togglePw }}" aria-label="Show password" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:6px;color:rgba(15,29,46,.55);display:flex" style-hover="color:#0F1D2E">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
      <a href="#" onClick="{{ onForgot }}" style="font-size:15px;font-weight:500;color:#1F6B73;text-decoration:underline;align-self:flex-start" style-hover="color:#E3735C">Reset password</a>
      <button onClick="{{ submit }}" style="font-family:Inter,sans-serif;font-size:16px;font-weight:600;color:#FFFFFF;background:#0F1D2E;border:none;border-radius:10px;padding:17px;cursor:pointer;width:100%;margin-top:8px;transition:background .2s" style-hover="background:#E3735C">Sign in</button>
    </div>
    <div style="font-size:15px;color:rgba(15,29,46,.7);margin-top:22px">New to CareOrbit? <a href="BookACall.dc.html?src=login" style="font-weight:500;color:#1F6B73;text-decoration:underline" style-hover="color:#E3735C">Book an intro call</a></div>
    <div style="width:100%;display:flex;align-items:center;gap:14px;margin-top:26px">
      <span style="flex:1;height:1px;background:rgba(15,29,46,.15)"></span>
      <span style="font-size:12.5px;font-weight:600;letter-spacing:.08em;color:rgba(15,29,46,.5)">OR</span>
      <span style="flex:1;height:1px;background:rgba(15,29,46,.15)"></span>
    </div>
    <div style="width:100%;display:flex;flex-direction:column;gap:12px;margin-top:24px">
      <button onClick="{{ onSso }}" style="font-family:Inter,sans-serif;font-size:15.5px;font-weight:500;color:#0F1D2E;background:#FFFFFF;border:1.5px solid rgba(15,29,46,.25);border-radius:10px;padding:15px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:12px;transition:border-color .2s" style-hover="border-color:#0F1D2E">
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.45a5.52 5.52 0 0 1-2.39 3.62v3h3.87c2.26-2.09 3.57-5.17 3.57-8.81z"></path><path fill="#34A853" d="M12 24c3.24 0 5.96-1.08 7.93-2.91l-3.87-3c-1.07.72-2.44 1.14-4.06 1.14-3.12 0-5.77-2.11-6.71-4.95H1.29v3.1A11.99 11.99 0 0 0 12 24z"></path><path fill="#FBBC05" d="M5.29 14.28A7.2 7.2 0 0 1 4.91 12c0-.79.14-1.56.38-2.28v-3.1H1.29A11.99 11.99 0 0 0 0 12c0 1.94.46 3.77 1.29 5.38l4-3.1z"></path><path fill="#EA4335" d="M12 4.77c1.76 0 3.34.6 4.58 1.79l3.44-3.44C17.95 1.19 15.23 0 12 0 7.31 0 3.26 2.69 1.29 6.62l4 3.1C6.23 6.88 8.88 4.77 12 4.77z"></path></svg>
        Continue with Google
      </button>
      <button onClick="{{ onSso }}" style="font-family:Inter,sans-serif;font-size:15.5px;font-weight:500;color:#0F1D2E;background:#FFFFFF;border:1.5px solid rgba(15,29,46,.25);border-radius:10px;padding:15px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:12px;transition:border-color .2s" style-hover="border-color:#0F1D2E">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#0F1D2E"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.08zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"></path></svg>
        Continue with Apple
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {email: "", password: "", showPw: false, notice: ""};
  renderVals() {
    return {
      email: this.state.email,
      password: this.state.password,
      pwType: this.state.showPw ? "text" : "password",
      notice: this.state.notice,
      onEmail: (e) => this.setState({email: e.target.value, notice: ""}),
      onPassword: (e) => this.setState({password: e.target.value, notice: ""}),
      togglePw: () => this.setState(s => ({showPw: !s.showPw})),
      onForgot: (e) => { e.preventDefault(); this.setState({notice: "[Placeholder: password reset flow. This demo login is not connected to the live CareOrbit application.]"}); },
      onSso: () => this.setState({notice: "[Placeholder: single sign-on. This demo login is not connected to the live CareOrbit application.]"}),
      submit: () => this.setState({notice: "[Placeholder: this demo login is not connected to the live CareOrbit application.]"})
    };
  }
}
</script>
</body>
</html>
