<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;font-family:Inter,sans-serif;color:#0F1D2E}a{color:#2D5A87}a:hover{color:#E3735C}</style>
</helmet>
<div style="font-family:Inter,sans-serif">
<sc-if value="{{ showAnnounce }}" hint-placeholder-val="{{ true }}">
  <div style="background:#0F1D2E;color:#CDD9E6;font-size:13px;line-height:1.4;text-align:center;padding:9px 20px">
    Live within large, complex health systems including BJC HealthCare, Washington University, and Siteman Cancer Center&nbsp;&nbsp;<a href="Outcomes.dc.html" style="color:#F2B8C6;font-weight:600;text-decoration:none" style-hover="color:#FFFFFF">See results &rarr;</a>
  </div>
</sc-if>
<div style="position:sticky;top:0;z-index:60;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid #EAF1F8">
  <div style="max-width:1180px;margin:0 auto;padding:0 28px;height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px">
    <a href="Home.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none">
      <svg width="40" height="40" viewBox="0 0 48 48" fill="none">
        <circle cx="42" cy="24" r="3.4" fill="#E8734D"></circle><circle cx="40.3" cy="16.4" r="2.8" fill="#EE7B4E"></circle><circle cx="35.6" cy="10.2" r="2" fill="#F08A5C"></circle><circle cx="28.7" cy="6.6" r="1.3" fill="#E8865A"></circle><circle cx="22.4" cy="6.1" r="0.9" fill="#2D5A87"></circle><circle cx="17.2" cy="7.3" r="1.3" fill="#3E6FB0"></circle><circle cx="11.3" cy="11.3" r="2.1" fill="#5B9BEA"></circle><circle cx="7.1" cy="17.8" r="2.9" fill="#4A8FE0"></circle><circle cx="6.1" cy="25.6" r="2" fill="#5B9BEA"></circle><circle cx="7.7" cy="31.6" r="1.3" fill="#7FB0F0"></circle><circle cx="10.6" cy="36" r="0.8" fill="#8AB6F2"></circle><circle cx="22.4" cy="41.9" r="0.7" fill="#E3735C"></circle><circle cx="28.7" cy="41.4" r="1" fill="#E3735C"></circle><circle cx="34.3" cy="38.7" r="1.4" fill="#C05AB8"></circle><circle cx="39.6" cy="33" r="2.4" fill="#E3735C"></circle>
        <path d="M24 33 C18.8 29.2 14.8 25.9 14.8 21.5 c0-3 2.4-5.4 5.4-5.4 1.9 0 3.7 1 4.6 2.7 0.9-1.7 2.7-2.7 4.6-2.7 3 0 5.4 2.4 5.4 5.4 0 4.4-4 7.7-9.8 11.5z" fill="#1E3A5F"></path>
      </svg>
      <span style="font-family:Lato,sans-serif;font-weight:700;font-size:22px;color:#1E3A5F;letter-spacing:-0.01em">CareOrbit</span>
    </a>
    <div style="display:flex;align-items:center;gap:28px">
      <a href="Platform.dc.html" style="text-decoration:none;font-size:15px;font-weight:500;color:{{ platformColor }}" style-hover="color:#E3735C">Platform</a>
      <div style="position:relative" onMouseEnter="{{ openMenu }}" onMouseLeave="{{ closeMenu }}">
        <span style="cursor:pointer;font-size:15px;font-weight:500;color:{{ orbitsColor }};display:inline-flex;align-items:center;gap:5px">Orbits
          <svg width="10" height="6" viewBox="0 0 10 6" style="transition:transform .2s;transform:{{ chevron }}"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"></path></svg>
        </span>
        <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;top:100%;left:-16px;padding-top:12px;z-index:70">
            <div style="background:#FFFFFF;border:1px solid #EAF1F8;border-radius:18px;box-shadow:0 18px 48px rgba(15,29,46,.14);padding:10px;width:300px;display:flex;flex-direction:column">
              <sc-for list="{{ orbitLinks }}" as="o" hint-placeholder-count="7">
                <a href="{{ o.file }}" style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:12px;text-decoration:none" style-hover="background:#F3F6FA">
                  <span style="font-size:14.5px;font-weight:500;color:#0F1D2E">{{ o.name }}</span>
                  <span style="font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:{{ o.chipColor }};background:{{ o.chipBg }};padding:3px 8px;border-radius:999px;white-space:nowrap">{{ o.status }}</span>
                </a>
              </sc-for>
            </div>
          </div>
        </sc-if>
      </div>
      <a href="Outcomes.dc.html" style="text-decoration:none;font-size:15px;font-weight:500;color:{{ outcomesColor }}" style-hover="color:#E3735C">Outcomes &amp; ROI</a>
      <a href="About.dc.html" style="text-decoration:none;font-size:15px;font-weight:500;color:{{ aboutColor }}" style-hover="color:#E3735C">About</a>
      <a href="BookACall.dc.html" style="text-decoration:none;font-size:14.5px;font-weight:600;color:#FFFFFF;background:#E3735C;padding:11px 22px;border-radius:999px;white-space:nowrap;transition:background .15s" style-hover="background:#D3644E;color:#FFFFFF">Book a Call</a>
    </div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:140},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;platform&quot;,&quot;orbits&quot;,&quot;outcomes&quot;,&quot;about&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;announce&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { open: false };
  renderVals() {
    const active = this.props.active ?? "home";
    const c = (k) => (active === k ? "#E3735C" : "#1E3A5F");
    const chip = (status) => status === "Live" ? {chipColor: "#1A6B3C", chipBg: "#EBF4EE"} :
      status === "Blueprint" ? {chipColor: "#2D5A87", chipBg: "#EAF1F8"} : {chipColor: "#B05A46", chipBg: "#FBEDE9"};
    const orbits = [
      ["Oncology", "Oncology.dc.html", "Live"],
      ["Cardiology", "Cardiology.dc.html", "Blueprint"],
      ["Orthopedics", "Orthopedics.dc.html", "Blueprint"],
      ["Women's Health", "WomensHealth.dc.html", "In build"],
      ["Bariatrics", "Bariatrics.dc.html", "In build"],
      ["Behavioral Health", "BehavioralHealth.dc.html", "In build"],
      ["Medication Therapy & Adherence", "MedicationTherapy.dc.html", "In integration"]
    ].map(([name, file, status]) => ({name, file, status, ...chip(status)}));
    return {
      showAnnounce: this.props.announce ?? true,
      platformColor: c("platform"), orbitsColor: c("orbits"), outcomesColor: c("outcomes"), aboutColor: c("about"),
      menuOpen: this.state.open,
      chevron: this.state.open ? "rotate(180deg)" : "none",
      orbitLinks: orbits,
      openMenu: () => this.setState({open: true}),
      closeMenu: () => this.setState({open: false})
    };
  }
}
</script>
</body>
</html>
