<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
</helmet>
<div style="background:#0F1D2E;color:#9FB3C8;font-family:Inter,sans-serif">
  <div style="max-width:1180px;margin:0 auto;padding:64px 28px 32px">
    <div style="display:flex;flex-wrap:wrap;gap:48px;justify-content:space-between">
      <div style="max-width:300px;display:flex;flex-direction:column;gap:16px">
        <div style="display:flex;align-items:center;gap:10px">
          <svg width="36" height="36" viewBox="0 0 48 48" fill="none">
            <circle cx="42" cy="24" r="3.4" fill="#FFFFFF"></circle><circle cx="40.3" cy="16.4" r="2.8" fill="#FFFFFF"></circle><circle cx="35.6" cy="10.2" r="2" fill="#FFFFFF"></circle><circle cx="28.7" cy="6.6" r="1.3" fill="#FFFFFF"></circle><circle cx="22.4" cy="6.1" r="0.9" fill="#FFFFFF"></circle><circle cx="17.2" cy="7.3" r="1.3" fill="#FFFFFF"></circle><circle cx="11.3" cy="11.3" r="2.1" fill="#FFFFFF"></circle><circle cx="7.1" cy="17.8" r="2.9" fill="#FFFFFF"></circle><circle cx="6.1" cy="25.6" r="2" fill="#FFFFFF"></circle><circle cx="7.7" cy="31.6" r="1.3" fill="#FFFFFF"></circle><circle cx="10.6" cy="36" r="0.8" fill="#FFFFFF"></circle><circle cx="22.4" cy="41.9" r="0.7" fill="#FFFFFF"></circle><circle cx="28.7" cy="41.4" r="1" fill="#FFFFFF"></circle><circle cx="34.3" cy="38.7" r="1.4" fill="#FFFFFF"></circle><circle cx="39.6" cy="33" r="2.4" fill="#FFFFFF"></circle>
            <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"><path d="M24 21V15.5"></path><path d="M24 27v5.5"></path><path d="M26.6 22.5l4.8-2.75"></path><path d="M21.4 25.5l-4.8 2.75"></path><path d="M21.4 22.5l-4.8-2.75"></path><path d="M26.6 25.5l4.8 2.75"></path></g>
          </svg>
          <span style="font-family:Lato,sans-serif;font-weight:700;font-size:20px;color:#FFFFFF">Total&nbsp;Orbit</span>
        </div>
        <div style="font-size:13.5px;line-height:1.6">CareOrbit is a Total Orbit company.<br><span style="color:#5F7690">[Placeholder: publishable company address]</span><br>St. Louis, Missouri</div>
        <div style="font-size:13.5px;line-height:1.8"><a href="mailto:sales@totalorbit.com" style="color:#CDD9E6;text-decoration:none" style-hover="color:#FFFFFF">sales@totalorbit.com</a><br><a href="tel:3145404827" style="color:#CDD9E6;text-decoration:none" style-hover="color:#FFFFFF">314-540-4827</a></div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:56px">
        <sc-for list="{{ cols }}" as="col" hint-placeholder-count="4">
          <div style="display:flex;flex-direction:column;gap:12px;min-width:130px">
            <div style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5F7690">{{ col.title }}</div>
            <sc-for list="{{ col.links }}" as="l" hint-placeholder-count="4">
              <a href="{{ l.href }}" style="font-size:14px;color:#9FB3C8;text-decoration:none;line-height:1.5" style-hover="color:#FFFFFF">{{ l.label }}</a>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="border-top:1px solid #1E3A5F;margin-top:48px;padding-top:24px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center">
      <div style="font-size:12.5px;color:#5F7690">&copy; 2026 Total Orbit. All rights reserved.</div>
      <div style="display:flex;gap:24px">
        <a href="#" style="font-size:12.5px;color:#9FB3C8;text-decoration:none" style-hover="color:#FFFFFF">HIPAA Compliance</a>
        <a href="#" style="font-size:12.5px;color:#9FB3C8;text-decoration:none" style-hover="color:#FFFFFF">Privacy Policy</a>
        <a href="#" style="font-size:12.5px;color:#9FB3C8;text-decoration:none" style-hover="color:#FFFFFF">Terms</a>
      </div>
    </div>
  </div>
</div>
</x-dc>

</html>
